# Local development: Postgres only, with the yugioh and yugioh_test databases. Run the app itself with `npm run dev`.
name: yugioh-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: yugioh
      POSTGRES_PASSWORD: yugioh
      POSTGRES_DB: yugioh
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro

volumes:
  pgdata:

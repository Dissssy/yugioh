# Type checks and the offline test suites (engine, server, web). No model calls: the judge evals are run by hand (docs/effects.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels its run still going; every push to main gets its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: yugioh
          POSTGRES_PASSWORD: yugioh
          POSTGRES_DB: yugioh_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U yugioh -d yugioh_test" --health-interval 2s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

# Production: the app image built by CI, plus Postgres. Settings come from .env next to this file (see .env.example).
# Update with: docker compose pull && docker compose up -d
name: yugioh

services:
  app:
    image: ghcr.io/dissssy/yugioh:latest
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      PORT: 3000
      DATABASE_URL: postgres://yugioh:${POSTGRES_PASSWORD}@postgres:5432/yugioh
      CARD_IMAGE_DIR: /data/card-images
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - card-images:/data/card-images
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: yugioh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: yugioh
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yugioh -d yugioh"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  card-images:

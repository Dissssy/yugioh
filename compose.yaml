# Production on the home server: the app image built by CI, using the host's shared Postgres 18 (compose project
# /git/postgres, service `db` on the external `postgres` network). Settings come from .env next to this file (see
# .env.example); the database login (PG* vars + DATABASE_URL) comes from the file written by /git/postgres/accounts.sh.
# Update with: docker compose pull && docker compose up -d
name: yugioh

services:
  app:
    image: ghcr.io/dissssy/yugioh:latest
    restart: unless-stopped
    init: true
    env_file:
      - .env
      - /srv/secrets/postgres/yugioh.env
    environment:
      PORT: 3000
      CARD_IMAGE_DIR: /data/card-images
    ports:
      - "127.0.0.1:3020:3000"
    volumes:
      - card-images:/data/card-images
    networks: [default, postgres]

networks:
  postgres:
    external: true

volumes:
  card-images:
